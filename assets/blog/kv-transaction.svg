<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" role="img" aria-labelledby="title desc">
  <title id="title">Grouped KV allocation as a transaction</title><desc id="desc">Reserve all required groups, then commit ownership. If a later group fails, restore every earlier mutation. Release only after dependent transfers complete.</desc>
  <rect width="780" height="250" fill="#fafafa"/>
  <text x="24" y="32" fill="#594578" font-size="13" font-family="monospace">CONCEPTUAL · OWNERSHIP INVARIANT</text>
  <line x1="24" y1="50" x2="756" y2="50" stroke="#d5d5dc"/>
  <g fill="#111111" font-size="18" font-family="sans-serif"><text x="34" y="96">Reserve groups</text><text x="292" y="96">Commit request ownership</text><text x="590" y="96">Use KV</text><text x="292" y="192">Rollback every mutation</text></g>
  <path d="M175 91 H273 M515 91 H570 M175 111 V183 H273" fill="none" stroke="#5f5f66" stroke-width="2"/>
  <text x="35" y="166" fill="#754a94" font-size="14" font-family="sans-serif">Later group fails</text>
  <path d="M620 110 V182 H570" fill="none" stroke="#5f5f66" stroke-width="2"/>
  <text x="480" y="211" fill="#5f5f66" font-size="14" font-family="sans-serif">Release after transfers finish</text>
  <text x="34" y="232" fill="#594578" font-size="14" font-family="sans-serif">Partial ownership must never survive a failed attempt.</text>
</svg>
