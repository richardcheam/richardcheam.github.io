<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-labelledby="title desc">
  <title id="title">Grouped KV allocation as a transaction</title><desc id="desc">Reserve all required groups, then commit ownership. If a later group fails, restore every earlier mutation. Release only after dependent transfers complete.</desc>
  <rect width="780" height="280" fill="#fafafa"/>
  <text x="24" y="35" fill="#594578" font-size="13" font-family="monospace">CONCEPTUAL · OWNERSHIP INVARIANT</text>
  <line x1="24" y1="56" x2="756" y2="56" stroke="#d5d5dc"/>
  <g fill="#111111" font-size="18" font-family="sans-serif"><text x="34" y="112">Reserve groups</text><text x="292" y="112">Commit request ownership</text><text x="590" y="112">Use KV</text><text x="292" y="217">Rollback every mutation</text></g>
  <path d="M175 107 H273 M515 107 H570 M130 129 V207 H273" fill="none" stroke="#5f5f66" stroke-width="2"/>
  <text x="35" y="190" fill="#754a94" font-size="14" font-family="sans-serif">Later group fails</text>
  <path d="M620 130 V208 H570" fill="none" stroke="#5f5f66" stroke-width="2"/>
  <text x="480" y="236" fill="#5f5f66" font-size="14" font-family="sans-serif">Release after transfers finish</text>
  <text x="34" y="264" fill="#594578" font-size="14" font-family="sans-serif">Partial ownership must never survive a failed attempt.</text>
</svg>
