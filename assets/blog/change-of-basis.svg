<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 326" role="img" aria-labelledby="title desc">
<title id="title">The same cloud described in two coordinate frames</title><desc id="desc">Two panels holding the identical tilted cloud. On the left the rulers are the encoder output units; on the right they are the eigenvectors. One highlighted point is projected onto each frame. The points do not move.</desc>
