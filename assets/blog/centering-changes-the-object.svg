<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
  <title id="title">Centering changes which object a rank diagnostic measures</title><desc id="desc">The same cloud read two ways. Participation ratio subtracts the mean first, so it sees only the spread and is blind to where the cloud sits. RankMe works on the raw embeddings, so the mean contributes a rank-one term to the spectrum it measures. Schematic.</desc>
  <rect width="780" height="320" fill="#fafafa"/>
  <text x="24" y="35" fill="#594578" font-size="13" font-family="monospace">SCHEMATIC · TWO RANK DIAGNOSTICS, TWO OBJECTS</text>
  <line x1="24" y1="54" x2="756" y2="54" stroke="#d5d5dc"/>

  <g stroke="#d5d5dc"><line x1="60" y1="200" x2="330" y2="200"/><line x1="90" y1="86" x2="90" y2="212"/></g>
  <circle cx="90" cy="200" r="3" fill="#5f5f66"/>
  <text x="60" y="222" fill="#5f5f66" font-size="12" font-family="monospace">origin</text>
  <g fill="#4F5D3A">
    <circle cx="232" cy="120" r="4"/><circle cx="252" cy="132" r="4"/><circle cx="214" cy="134" r="4"/>
    <circle cx="238" cy="146" r="4"/><circle cx="262" cy="118" r="4"/><circle cx="220" cy="112" r="4"/>
    <circle cx="246" cy="104" r="4"/>
  </g>
  <line x1="90" y1="200" x2="232" y2="128" stroke="#A8503A" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="124" y="176" fill="#A8503A" font-size="13" font-family="monospace">mean μ</text>
  <text x="60" y="258" fill="#111111" font-size="16" font-family="sans-serif">RankMe · raw embeddings</text>
  <text x="60" y="280" fill="#5f5f66" font-size="13" font-family="monospace">μ contributes to the spectrum</text>

  <line x1="390" y1="78" x2="390" y2="290" stroke="#d5d5dc"/>

  <g stroke="#d5d5dc"><line x1="450" y1="200" x2="720" y2="200"/><line x1="585" y1="86" x2="585" y2="212"/></g>
  <circle cx="585" cy="200" r="3" fill="#5f5f66"/>
  <g fill="#4F5D3A">
    <circle cx="579" cy="172" r="4"/><circle cx="599" cy="184" r="4"/><circle cx="561" cy="186" r="4"/>
    <circle cx="585" cy="198" r="4"/><circle cx="609" cy="170" r="4"/><circle cx="567" cy="164" r="4"/>
    <circle cx="593" cy="156" r="4"/>
  </g>
  <text x="450" y="258" fill="#111111" font-size="16" font-family="sans-serif">Participation ratio · centered</text>
  <text x="450" y="280" fill="#5f5f66" font-size="13" font-family="monospace">μ subtracted, then measured</text>

  <text x="30" y="310" fill="#594578" font-size="16" font-family="sans-serif">Same cloud, same shape, different reading. Translation is invisible to one and not the other.</text>
</svg>
