<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" role="img" aria-labelledby="title desc">
<title id="title">The embedding matrix</title><desc id="desc">A grid with one row per input clip and one column per embedding dimension. A highlighted row is a single clip's embedding vector. A highlighted column is one feature read across every clip.</desc>
<rect width="780" height="336" fill="#fafafa"/>
<text x="24" y="35" fill="#594578" font-size="13" font-family="monospace">THE ONE OBJECT EVERY DIAGNOSTIC IS COMPUTED ON</text>
<line x1="24" y1="54" x2="756" y2="54" stroke="#d5d5dc"/>
<rect x="200" y="108" width="400" height="28" fill="#4F5D3A" opacity="0.18"/>
<rect x="360" y="80" width="80" height="140" fill="#A8503A" opacity="0.18"/>
<rect x="200" y="80" width="400" height="140" fill="none" stroke="#5f5f66"/>
<line x1="200" y1="108" x2="600" y2="108" stroke="#d5d5dc"/>
<line x1="200" y1="136" x2="600" y2="136" stroke="#d5d5dc"/>
<line x1="200" y1="164" x2="600" y2="164" stroke="#d5d5dc"/>
<line x1="200" y1="192" x2="600" y2="192" stroke="#d5d5dc"/>
<line x1="280" y1="80" x2="280" y2="220" stroke="#d5d5dc"/>
<line x1="360" y1="80" x2="360" y2="220" stroke="#d5d5dc"/>
<line x1="440" y1="80" x2="440" y2="220" stroke="#d5d5dc"/>
<line x1="520" y1="80" x2="520" y2="220" stroke="#d5d5dc"/>
<text x="240" y="70" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="middle">dim 1</text>
<text x="320" y="70" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="middle">dim 2</text>
<text x="400" y="70" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="middle">dim 3</text>
<text x="480" y="70" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="middle">⋯</text>
<text x="560" y="70" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="middle">dim 256</text>
<text x="192" y="98" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="end">clip 00001</text>
<text x="192" y="126" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="end">clip 00002</text>
<text x="192" y="154" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="end">clip 00003</text>
<text x="192" y="182" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="end">⋮</text>
<text x="192" y="210" fill="#5f5f66" font-size="12" font-family="monospace" text-anchor="end">clip 10000</text>
<rect x="200" y="246" width="11" height="11" fill="#4F5D3A" opacity="0.5"/>
<text x="220" y="256" fill="#111111" font-size="14" font-family="sans-serif">a row is one clip, described by 256 numbers</text>
<rect x="200" y="272" width="11" height="11" fill="#A8503A" opacity="0.5"/>
<text x="220" y="282" fill="#111111" font-size="14" font-family="sans-serif">a column is one feature, measured across 10,000 clips</text>
<text x="30" y="314" fill="#594578" font-size="16" font-family="sans-serif">Rows answer “what is this clip?”. Columns answer “what does this feature respond to?”</text>
<text x="30" y="332" fill="#5f5f66" font-size="13" font-family="sans-serif">Same numbers, two readings. Rank questions live in the row view, correlation questions in the column view.</text>
</svg>